# Temporary: reads the live app's AI error lines (only lines tagged [bloom:ai]).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: AI errors from the app log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets list -a bloom-kohdyism | awk 'NR==1 || /ANTHROPIC|BLOOM_AI/ {print $1, $3, $4}' | while read -r l; do echo "::notice::secret $l"; done || echo "::notice::secrets list not allowed"
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | grep -E "bloom:ai" | sed -E 's/sk-ant[A-Za-z0-9_-]*/[key]/g' | tail -8 | while read -r l; do echo "::notice::${l:0:400}"; done
          echo "::notice::done"
