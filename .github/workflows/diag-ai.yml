# One-off, requested by the owner: wipe the live demo's lessons, progress and
# flowers and reseed the fictional demo data (same demo sign-ins).
name: Reset live demo data
on:
  push:
    branches: [diag-ai]
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reset and reseed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          out=$(flyctl ssh console -a bloom-kohdyism -C "sh -c 'cd /app && npx tsx scripts/db.ts reset 2>&1 | tail -4; rm -rf /data/uploads/* && echo RESET-UPLOADS-CLEARED'" 2>&1 | tail -6)
          echo "$out" | while read -r l; do echo "::notice::${l:0:300}"; done
