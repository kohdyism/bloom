# Temporary: makes one tiny Claude call from inside the live app (with its own key) and prints only the outcome.
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/checkout@v4
      - name: Real AI workflows from the app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh sftp shell -a bloom-kohdyism <<< "put .github/probe-ai.ts /app/src/probe-ai.ts" >/dev/null 2>&1 || echo "::notice::sftp failed"
          out=$(flyctl ssh console -a bloom-kohdyism -C "sh -c 'cd /app && NODE_OPTIONS=--conditions=react-server npx tsx --tsconfig tsconfig.json src/probe-ai.ts 2>&1 | grep PROBE; rm -f src/probe-ai.ts'" 2>&1 | grep PROBE || true)
          [ -z "$out" ] && out="no output"
          echo "$out" | while read -r l; do echo "::notice::${l:0:380}"; done
