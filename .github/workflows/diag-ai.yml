# Temporary: check the live app after a deploy (migrations, seed, pages up).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -iE "applying|demo data|seeded|migrat|error|exception" | grep -viE "GET /_next" | tail -8 | while read -r l; do echo "::notice::${l:0:300}"; done
          echo "::notice::sign-in $(curl -s -o /dev/null -w '%{http_code}' https://bloom-kohdyism.fly.dev/sign-in)"
          echo "::notice::print route $(curl -s -o /dev/null -w '%{http_code}' https://bloom-kohdyism.fly.dev/print/student/00000000-0000-0000-0000-000000000000)"
