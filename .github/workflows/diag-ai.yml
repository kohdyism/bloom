# Temporary: post-deploy health check and recent AI fallback reasons (only safe log lines).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Health and AI warnings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          out=$(flyctl ssh console -a bloom-kohdyism -C "sh -c 'ls -d .next/server/app/student/past; ls supabase/migrations | tail -1'" 2>&1 | tail -2 | tr '\n' ' ')
          echo "::notice::SSH ${out:0:300}"
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -E "lesson_notes|Ready in|bloom:ai|Empty AI" | sed -E 's/sk-ant[A-Za-z0-9_-]*/[key]/g' | tail -8 | while read -r l; do echo "::notice::${l:0:400}"; done
