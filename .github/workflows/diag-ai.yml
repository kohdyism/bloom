# Temporary: post-deploy health check and recent AI fallback reasons (only safe log lines).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Health and AI warnings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for p in /sign-in /student/past /teacher/reports; do echo "::notice::GET $p -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://bloom-kohdyism.fly.dev$p)"; done
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | grep -E "applying|lesson_notes|seed|Ready in|bloom:ai|Empty AI|Error" | sed -E 's/sk-ant[A-Za-z0-9_-]*/[key]/g' | tail -15 | while read -r l; do echo "::notice::${l:0:400}"; done
          flyctl ssh console -a bloom-kohdyism -C "sh -c 'ls -d .next/server/app/student/past* 2>&1; ls supabase/migrations | tail -1'" 2>&1 | tail -3 | while read -r l; do echo "::notice::SSH ${l:0:200}"; done
          echo "::notice::done"
