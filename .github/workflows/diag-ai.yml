# Temporary: recent AI fallback reasons from the live app log (only [bloom:ai] lines).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: AI warnings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | grep -E "bloom:ai|AI request|anthropic|rate|overloaded" | sed -E 's/sk-ant[A-Za-z0-9_-]*/[key]/g' | tail -10 | while read -r l; do echo "::notice::${l:0:400}"; done
          echo "::notice::done"
