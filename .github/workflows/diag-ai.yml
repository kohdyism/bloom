# Temporary: recent errors from the live app log (safe lines only).
name: Diagnose live AI
on:
  push:
    branches: [diag-ai]
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Errors
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl logs -a bloom-kohdyism --no-tail 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -viE "bloom:ai|GET /_next|health" | grep -iE "error|fail|exception|unhandled|denied|violat|constraint|TypeError|500" | sed -E 's/sk-ant[A-Za-z0-9_-]*/[key]/g' | tail -9 | while read -r l; do echo "::notice::${l:0:420}"; done
          echo "::notice::END $(flyctl logs -a bloom-kohdyism --no-tail 2>&1 | wc -l) lines"
