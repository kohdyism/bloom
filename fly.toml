# Fly.io configuration for Bloom. Change `app` if the name is taken.
# Setup steps: see README → Deployment → Fly.io.
app = "bloom-kohdyism"
primary_region = "lhr"   # London

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  BLOOM_DEMO_MODE = "true"
  BLOOM_UPLOAD_DIR = "/data/uploads"

# Uploaded photo evidence. One volume = one machine; keep a single machine.
[mounts]
  source = "bloom_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Live lessons hold open realtime connections, so never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/sign-in"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
